<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent monitor</title>
<link rel="stylesheet" href="strip.css">
</head>
<body>

<!-- The top 26px of the window is a native drag handle (see ChromeView.swift).
     This pill is the only hint of it; it covers no content and takes no clicks. -->
<div id="grip" aria-hidden="true"></div>

<div id="strip">

  <section class="region r-agents">
    <header><span class="rlabel">agents</span><span id="agents-more" class="more"></span></header>
    <div id="agents" class="rows"></div>
  </section>

  <section class="region r-quota">
    <header><span class="rlabel">quota</span><span id="quota-more" class="more"></span></header>
    <div id="quota" class="rows"></div>
  </section>

  <section class="region r-today">
    <header><span class="rlabel">today</span></header>
    <div id="today" class="rows"></div>
  </section>

  <!-- What the day actually cost, hour by hour. Replaces the summaries card:
       pre-summarising sessions moved to the dsh-brain hooks, and this is the one
       thing the panel knows that nothing else on screen does. -->
  <section class="region r-usage">
    <header>
      <span class="rlabel">24h</span>
      <span class="hgroup">
        <span id="u-total" class="u-total"></span>
        <span id="conn" class="conn" title="connecting"></span>
      </span>
    </header>
    <div id="usage" class="usage">
      <div id="u-bars" class="u-bars"></div>
      <div id="u-axis" class="u-axis"></div>
      <div id="u-foot" class="u-foot"></div>
    </div>
  </section>

</div>

<script src="strip.js"></script>
</body>
</html>
