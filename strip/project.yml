name: AgentMonitorStrip
options:
  bundleIdPrefix: local.agentmonitor
  deploymentTarget:
    macOS: "14.0"
  createIntermediatesGroups: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AgentMonitorStrip:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentMonitorStrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.agentmonitor.strip
        PRODUCT_NAME: AgentMonitorStrip
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
